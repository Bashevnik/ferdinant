<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Магазин - Ferdinand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#050505">
    <script>document.documentElement.classList.add('reveal-init');setTimeout(function(){document.documentElement.classList.remove('reveal-init');},2500);</script>
    <style>
        .product-grid-new {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 60px;
        }

        @media (max-width: 1200px) {
            .product-grid-new {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }
        }

        @media (max-width: 600px) {
            .product-grid-new {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }

        .product-card-premium {
            background: #080808;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
            position: relative;
        }

        .product-card-premium:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ffffff;
            color: #000000;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 10;
        }

        .img-container-premium {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            /* Clean product tile — full product always visible on white */
            background: #ffffff;
        }

        /* For photos shot on a dark background (e.g. the Perfomen set):
           keep a dark tile so the letterboxing blends seamlessly */
        .img-container-premium.img-dark {
            background: #0b0b0b;
        }

        .img-container-premium img {
            width: 100%;
            height: 100%;
            /* light tiles: contain, no padding — bottle fills the tile (no crop),
               seamless on white */
            object-fit: contain;
            padding: 0;
            box-sizing: border-box;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* dark studio shots are composed to fill — let them cover the whole tile */
        .img-container-premium.img-dark img {
            object-fit: cover;
        }

        .img-container-premium .secondary-img {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }

        .product-card-premium:hover .img-container-premium img.primary-img {
            transform: scale(1.04);
        }

        .product-card-premium:hover .img-container-premium img.secondary-img {
            opacity: 1;
            transform: scale(1.04);
        }

        .product-card-premium:hover .img-container-premium.has-secondary img.primary-img {
            opacity: 0;
        }

        .single-volume-badge {
            width: 100%;
            background: #111111;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 15px;
            font-size: 13px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-align: center;
        }

        .info-container-premium {
            padding: 25px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-art {
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-name {
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.2;
            font-weight: 500;
        }

        .product-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-details-toggle {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: underline;
            cursor: pointer;
            margin-bottom: 15px;
            transition: color 0.3s ease;
        }

        .product-details-toggle:hover {
            color: var(--text-main);
        }

        .product-details-content {
            display: none;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            border-left: 2px solid var(--border);
            padding-left: 12px;
        }

        .volume-selector-premium {
            width: 100%;
            background: #111111;
            border: 1px solid var(--border);
            color: #ffffff;
            padding: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            outline: none;
            cursor: pointer;
            font-family: inherit;
        }

        .price-row-premium {
            display: flex;
            align-items: baseline;
            gap: 15px;
            margin-bottom: 20px;
            margin-top: auto;
        }

        .price-current {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-main);
            font-family: var(--font-head);
        }

        .price-rrp {
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .price-rrp-label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div class="page-wrapper">
        <div data-include="components/header.html"></div>

        <main class="page-container" style="padding-top: 120px; min-height: 80vh;">
            <div class="section-head">
                <h1 class="section-title head-font">Магазин</h1>
                <span class="section-meta">04 / Догляд та Стиль</span>
            </div>

            <div class="shop-toolbar reveal-up">
                <p>Оберіть продукт, об'єм і додайте його в кошик. Замовлення оформлюється без переходу на онлайн-запис.</p>
                <button class="btn-outline cart-toggle-btn" id="openCart" type="button">
                    КОШИК <span id="cartCount">0</span>
                </button>
            </div>

            <div class="product-grid-new">
                <p class="shop-loading" style="grid-column:1/-1;color:var(--text-muted);text-align:center;padding:60px 0;">Завантаження товарів…</p>
                <noscript><p style="grid-column:1/-1;color:var(--text-muted);text-align:center;padding:60px 0;">Увімкніть JavaScript, щоб побачити товари.</p></noscript>
            </div>
        </main>

        <div data-include="components/footer.html"></div>
    </div>

    <!-- Мобільне меню -->


    <!-- Модалка контактів -->
    <div class="modal-overlay" id="contactModal">
        <div class="contact-form modal-content-box" style="max-width: 450px;">
            <div class="close-modal close-contact">&times;</div>
            <h2 class="head-font" style="font-size: 32px; margin-bottom: 30px; text-align: center;">ЗАПИСАТИСЯ</h2>
            <form>
                <div class="form-group"><input type="text" placeholder="Ваше ім'я" required></div>
                <div class="form-group"><input type="tel" placeholder="Ваш телефон" required></div>
                <div class="form-group"><input type="date" required></div>
                <button type="submit" class="btn-outline" style="width: 100%; border-radius: 0;">ВІДПРАВИТИ
                    ЗАЯВКУ</button>
            </form>
        </div>
    </div>

    <div class="cart-backdrop" id="cartBackdrop"></div>
    <aside class="cart-panel" id="cartPanel" aria-label="Кошик магазину">
        <div class="cart-panel-head">
            <div>
                <span class="section-meta">Shop order</span>
                <h2 class="head-font">Кошик</h2>
            </div>
            <button class="close-cart" id="closeCart" type="button" aria-label="Закрити кошик">&times;</button>
        </div>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-empty" id="cartEmpty">Кошик порожній</div>

        <div class="cart-summary">
            <span>Разом</span>
            <strong><span id="cartTotal">0</span> ₴</strong>
        </div>

        <form class="cart-form" id="cartForm">
            <div class="form-group"><input type="text" name="name" placeholder="Ваше ім'я" required></div>
            <div class="form-group"><input type="tel" name="phone" placeholder="Ваш телефон" required></div>
            <div class="form-group"><input type="text" name="address" placeholder="Адреса доставки" required></div>
            <div class="form-group"><textarea name="comment" placeholder="Коментар"></textarea></div>
            <button class="btn-outline" type="submit">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
        </form>

        <div class="cart-result" id="cartResult" aria-live="polite"></div>
    </aside>

    <div class="booking-bubble open-contact-modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path
                d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" />
        </svg>
        <span>ЗАПИСАТИСЯ</span>
    </div>

    <a href="tel:+380670063033" class="contact-bubble">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path
                d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.72 11.72 0 00.59 3.7 1 1 0 01-.27 1.11l-2.2 2.2z" />
        </svg>
        <span>ЗВ'ЯЗОК</span>
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
    <script>
        function toggleDetails(btn) {
            const content = btn.nextElementSibling;
            if (content.style.display === "block") {
                content.style.display = "none";
                btn.textContent = "Детальніше про склад";
            } else {
                content.style.display = "block";
                btn.textContent = "Приховати склад";
            }
        }

        function updateProductPrice(select) {
            const option = select.options[select.selectedIndex];
            const price = option.getAttribute('data-price');
            const rrp = option.getAttribute('data-rrp');
            const card = select.closest('.info-container-premium');

            card.querySelector('.price-val').textContent = price;
            card.querySelector('.rrp-val').textContent = rrp;
            card.querySelector('.rrp-strike-val').textContent = rrp;
        }
    </script>
</body>

</html>
