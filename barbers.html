<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Барбери - Ferdinand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#050505">
    <script>document.documentElement.classList.add('reveal-init');setTimeout(function(){document.documentElement.classList.remove('reveal-init');},2500);</script>
    <style>
        /* Barber card photo helper — img inside card used as image source */
        .card-photo-src {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div class="page-wrapper">
        <div data-include="components/header.html"></div>

        <main class="page-container">
            <div class="section-head">
                <h1 class="section-title head-font">Команда</h1>
                <span class="section-meta">01 / Наша команда</span>
            </div>

            <div class="team-feature">
                <img src="new-images/main_new.jpg" alt="Наша команда FERDINAND BARBERSHOP" loading="eager" decoding="async">
            </div>

            <div class="barber-slider-container">
                <div class="barber-slider" id="barberSlider">

                    <!-- Аліна -->
                    <div class="card barber-card" data-name="Аліна" data-title="Барбер"
                        data-photos="new-images/alina.jpg"
                        data-desc="Аліна створює акуратні, сучасні образи без зайвого шуму: чистий контур, правильна довжина і комфортна консультація перед кожною послугою.">
                        <img class="card-photo-src" src="new-images/alina.jpg" alt="Аліна" loading="lazy" decoding="async">
                        <div class="card-img-bg" style="background-image: url('new-images/alina.jpg');"></div>
                        <div class="card-content">
                            <span class="card-num">01</span>
                            <div>
                                <h3 class="card-title head-font">Аліна</h3>
                                <p class="card-subtitle">Барбер</p>
                                <div class="card-meta">
                                    <span class="card-chip">Барбер</span>
                                </div>
                                <button class="btn-outline" type="button">Детальніше</button>
                            </div>
                        </div>
                    </div>

                    <!-- Анастасія -->
                    <div class="card barber-card" data-name="Анастасія" data-title="Старший барбер"
                        data-photos="new-images/nastya.jpg"
                        data-desc="Анастасія відповідає за преміальну точність FERDINAND: виразні фейди, збалансована форма і спокійний сервіс, у якому кожна деталь має свою вагу.">
                        <img class="card-photo-src" src="new-images/nastya.jpg" alt="Анастасія" loading="lazy" decoding="async">
                        <div class="card-img-bg" style="background-image: url('new-images/nastya.jpg');"></div>
                        <div class="card-content">
                            <span class="card-num">02</span>
                            <div>
                                <h3 class="card-title head-font">Анастасія</h3>
                                <p class="card-subtitle">Старший барбер</p>
                                <div class="card-meta">
                                    <span class="card-chip">Старший барбер</span>
                                </div>
                                <button class="btn-outline" type="button">Детальніше</button>
                            </div>
                        </div>
                    </div>

                    <!-- Іра -->
                    <div class="card barber-card" data-name="Іра" data-title="Старший барбер"
                        data-photos="new-images/ira.jpg"
                        data-desc="Іра працює з характером образу: підбирає форму під риси обличчя, чисто веде машинку та доводить стрижку до впевненої фінальної лінії.">
                        <img class="card-photo-src" src="new-images/ira.jpg" alt="Іра" loading="lazy" decoding="async">
                        <div class="card-img-bg" style="background-image: url('new-images/ira.jpg');"></div>
                        <div class="card-content">
                            <span class="card-num">03</span>
                            <div>
                                <h3 class="card-title head-font">Іра</h3>
                                <p class="card-subtitle">Старший барбер</p>
                                <div class="card-meta">
                                    <span class="card-chip">Старший барбер</span>
                                </div>
                                <button class="btn-outline" type="button">Детальніше</button>
                            </div>
                        </div>
                    </div>

                    <!-- Денис -->
                    <div class="card barber-card" data-name="Денис" data-title="Топ барбер"
                        data-photos="new-images/denis.jpg"
                        data-desc="Денис — top barber команди FERDINAND. Його робота про сильний силует, чисту геометрію, впевнений фейд і результат, який виглядає дорого без зайвих пояснень.">
                        <img class="card-photo-src" src="new-images/denis.jpg" alt="Денис" loading="lazy" decoding="async">
                        <div class="card-img-bg" style="background-image: url('new-images/denis.jpg');"></div>
                        <div class="card-content">
                            <span class="card-num">04</span>
                            <div>
                                <h3 class="card-title head-font">Денис</h3>
                                <p class="card-subtitle">Топ барбер</p>
                                <div class="card-meta">
                                    <span class="card-chip">Топ барбер</span>
                                </div>
                                <button class="btn-outline" type="button">Детальніше</button>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="slider-nav">
                <div class="slider-arrow" id="prevBarber">←</div>
                <div class="slider-arrow" id="nextBarber">→</div>
            </div>
        </main>

        <div data-include="components/footer.html"></div>
    </div>

    <!-- Мобільне меню -->


    <!-- Модалка контактів -->
    <div class="modal-overlay" id="contactModal">
        <div class="contact-form modal-content-box">
            <div class="close-modal close-contact">&times;</div>
            <h2 class="head-font" style="font-size: 32px; margin-bottom: 30px;">ЗАПИСАТИСЯ</h2>
            <form>
                <div class="form-group"><input type="text" placeholder="Ваше ім'я" required></div>
                <div class="form-group"><input type="tel" placeholder="Ваш телефон" required></div>
                <div class="form-group"><input type="date" required></div>
                <button type="submit" class="btn-outline" style="width: 100%;">ВІДПРАВИТИ ЗАЯВКУ</button>
            </form>
        </div>
    </div>

    <!-- Фулскрін Модалка Барбера -->
    <div class="modal-overlay barber-modal" id="barberModal">
        <div class="barber-box modal-content-box">
            <div class="close-modal close-barber" style="font-size: 50px; right: 4vw; top: 40px; z-index: 100;">&times;
            </div>
            <div class="barber-modal-img" id="bm-img"></div>
            <div class="barber-modal-info">
                <span class="barber-role" id="bm-title"></span>
                <h2 class="head-font" id="bm-name"></h2>
                <p id="bm-desc" class="barber-desc"></p>
                <div style="margin-top: 60px;">
                    <button class="btn-outline open-contact-modal" type="button"
                        style="padding: 20px 60px; font-size: 14px;">ЗАПИСАТИСЯ ДО БАРБЕРА</button>
                </div>
            </div>
        </div>
    </div>

    <div class="booking-bubble open-contact-modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
        </svg>
        <span>ЗАПИСАТИСЯ</span>
    </div>

    <a href="tel:+380733144009" class="contact-bubble">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.72 11.72 0 003.7.59 1 1 0 011 1V20a1 1 0 01-1 1A15 15 0 013 6a1 1 0 011-1h3.41a1 1 0 011 1 11.72 11.72 0 00.59 3.7 1 1 0 01-.27 1.11l-2.2 2.2z"/>
        </svg>
        <span>ЗВ'ЯЗОК</span>
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
