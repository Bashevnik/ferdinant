<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Послуги - Ferdinand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#050505">
    <script>document.documentElement.classList.add('reveal-init');setTimeout(function(){document.documentElement.classList.remove('reveal-init');},2500);</script>
</head>

<body>
    <canvas id="particle-canvas"></canvas>

    <div class="page-wrapper">
        <div data-include="components/header.html"></div>

        <main class="page-container">
            <div class="section-head">
                <h1 class="section-title head-font">Єдиний прайс</h1>
                <span class="section-meta">02 / Послуги</span>
            </div>

            <div class="service-intro reveal-up">
                <p>Ціни зведені в один список без дублювання по майстрах. Якщо послуга виконується на різних рівнях майстрів, показаний діапазон.</p>
                <span>Барбер / Старший барбер / Топ барбер</span>
            </div>

            <div class="service-list service-list-premium" id="serviceList"></div>

            <div class="services-cta">
                <button class="btn-outline open-contact-modal" type="button">ЗАПИСАТИСЯ НА ПОСЛУГУ</button>
            </div>
        </main>

        <div data-include="components/footer.html"></div>
    </div>

    <!-- Мобільне меню -->


    <!-- Модалка контактів -->
    <div class="modal-overlay" id="contactModal">
        <div class="contact-form modal-content-box">
            <div class="close-modal close-contact">&times;</div>
            <h2 class="head-font" style="font-size: 32px; margin-bottom: 30px;">ЗАПИСАТИСЯ</h2>
            <form>
                <div class="form-group"><input type="text" placeholder="Ваше ім'я" required></div>
                <div class="form-group"><input type="tel" placeholder="Ваш телефон" required></div>
                <div class="form-group">
                    <select
                        style="width: 100%; padding: 15px 0; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); color: #fff; outline: none; margin-bottom: 30px;">
                        <option value="" disabled selected>Оберіть послугу</option>
                        <option value="cut">Чоловіча стрижка</option>
                        <option value="machine">Стрижка машинкою</option>
                        <option value="scissors">Стрижка ножицями</option>
                        <option value="beard">Моделювання бороди</option>
                        <option value="camouflage">Камуфлювання</option>
                    </select>
                </div>
                <div class="form-group"><input type="date" required></div>
                <button type="submit" class="btn-outline" style="width: 100%;">ВІДПРАВИТИ ЗАЯВКУ</button>
            </form>
        </div>
    </div>

    <div class="booking-bubble open-contact-modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path
                d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" />
        </svg>
        <span>ЗАПИСАТИСЯ</span>
    </div>

    <a href="tel:+380670063033" class="contact-bubble">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
            <path
                d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.72 11.72 0 003.7.59 1 1 0 011 1V20a1 1 0 01-1 1A15 15 0 013 6a1 1 0 011-1h3.41a1 1 0 011 1 11.72 11.72 0 00.59 3.7 1 1 0 01-.27 1.11l-2.2 2.2z" />
        </svg>
        <span>ЗВ'ЯЗОК</span>
    </a>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
